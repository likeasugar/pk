  if (b){ b.style.display = "block"; b.textContent = "脚本出错：" + msg + "（第 " + line + " 行）"; }
};

const initScope = location.hash.replace("#", "");
if (["pre", "post", "all"].indexOf(initScope) >= 0) scope = initScope;

function inRange(r){
  const from = $("#from").value, to = $("#to").value;
  if (from && r.ko < from.replace("T"," ")) return false;
  if (to && r.ko > to.replace("T"," ")) return false;
  return true;
}

function isPre(r){ return r.st === 0 || r.st === -11 || r.st === -14; }

function matchesScope(r){
  if (scope === "pre") return isPre(r);
  if (scope === "post") return !isPre(r);
  return true;
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function card(r){
  const hot = Math.max(r.rise, r.fall) >= 2 ? " card hot" : " card";
  const chips = r.det.map(d =>
    `<span class="${d.dir}">${esc(d.c)} ${d.f.toFixed(2)} → ${d.h.toFixed(2)}</span>`).join("");
  let stTag;
  if (r.st === 0) stTag = `<span class="tag">开赛前 ${r.dmin} 分</span>`;
  else if (r.st === -11 || r.st === -14) stTag = `<span class="tag">${esc(r.stt)}</span>`;
  else if (r.st === 3 || r.st === -1) stTag = `<span class="tag done">${esc(r.stt)}</span>`;
  else stTag = `<span class="tag live">${esc(r.stt)}</span>`;

  const scoreBox = r.sc
    ? `<div class="sc">${esc(r.sc)}</div>`
    : `<div class="sc vs">VS</div>`;
  let pick;
  if (!r.pick) pick = `<span class="pick none">分歧 · 观望</span>`;
  else {
    const cls = r.plabel === "上盘" ? "pick up" : "pick down";
    pick = `<span class="${cls}">${esc(r.pname)}</span><span class="plabel">${r.plabel}</span>`;
  }

  return `<div class="${hot}">
  <div class="topline"><span class="tag">${esc(r.lg)}</span>${stTag}
  <span class="tag">升 ${r.rise} · 降 ${r.fall}</span>
  <span class="time">${esc(r.ko.slice(5))}</span></div>
  <div class="score-line">
    <div class="t">${esc(r.home)}</div>
    ${scoreBox}
    <div class="t guest">${esc(r.guest)}</div>
  </div>
  <div class="mv">${chips}</div>
  <div class="result"><div class="k">预测（降买上 / 升买下）</div>
  <div class="pickrow">${pick}</div></div></div>`;
}

function render(){
  const list = DATA.filter(r => matchesScope(r) && inRange(r));
  const box = $("#list");
  let html = "";

  if (!list.length){
    html = `<div class="empty">这个筛选条件下没有变盘 0.25 的场次</div>`;
  } else if (scope === "pre"){
    for (let i = 0; i <= BANDS.length; i++){
      const lo = i === 0 ? 0 : BANDS[i-1] * 60;
      const hi = i === BANDS.length ? Infinity : BANDS[i] * 60;
      const g = list.filter(r => r.dmin > lo && r.dmin <= hi);
      if (!g.length) continue;
      let title;
      if (i === 0) title = "临场 1 小时";
      else if (i === BANDS.length) title = BANDS[BANDS.length-1] + " 小时以上";
      else title = BANDS[i-1] + "~" + BANDS[i] + " 小时";
      html += `<h2>${title} <span class="n">${g.length}</span></h2>` + g.map(card).join("");
    }
    const odd = list.filter(r => r.st !== 0);
    if (odd.length) html += `<h2>待定 / 推迟 <span class="n">${odd.length}</span></h2>` + odd.map(card).join("");
  } else {
    const g = list.slice().sort((a,b) => b.ts - a.ts);
    html = `<h2>${scope === "post" ? "已开赛" : "全部"} <span class="n">${g.length}</span></h2>` + g.map(card).join("");
  }
  box.innerHTML = html;
  $("#count").textContent = `共 ${list.length} 场`;
}

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 1600);
}

function daysBetween(a, b){
  const out = [];
  if (!a) return out;
  const start = new Date(a + "T00:00:00");
  const end = b ? new Date(b + "T00:00:00") : start;
  if (isNaN(start.getTime()) || isNaN(end.getTime())) return out;
  const d = new Date(start);
  while (d <= end && out.length < 10){
    out.push(d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"));
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function setScope(s){
  scope = s;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.scope === s));
  if (location.protocol.startsWith("http")){
    try { history.replaceState(null, "", "#" + s); } catch(e){}
  }
}

function apiUrl(path){
  const sep = path.indexOf("?") >= 0 ? "&" : "?";
  return API_BASE + path + (API_KEY ? sep + "k=" + encodeURIComponent(API_KEY) : "");
}

async function fetchJson(path){
  const r = await fetch(apiUrl(path), {cache: "no-store"});
  const txt = await r.text();
  let j;
  try { j = JSON.parse(txt); }
  catch(e){
    if (r.status === 401) throw new Error("密钥不对，检查 --api-key 是否和 Worker 一致");
    throw new Error(r.status === 503 ? "服务端抓不到数据（可能被 WAF 拦），稍后重试"
                                     : "服务端返回的不是数据（HTTP " + r.status + "）");
  }
  if (j.error) throw new Error(j.error);
  return j;
}

function canRemote(){ return !!API_BASE || location.protocol.startsWith("http"); }

async function loadIssues(list){
  const btn = $("#search");
  if (!canRemote()){
    render();
    toast("本地文件只含 " + ISSUE + " 一天；换日期需要配置云端地址");
    return;
  }
  btn.disabled = true; btn.textContent = "搜索中…";
  try {
    const days = list.slice(0, 10);
    if (days.length > 1) toast("加载 " + days.length + " 天…");
    let rows = [], snap = "";
    for (const d of days){
      const j = await fetchJson(API_BASE + "/json?issue=" + d + "&force=1");
      if (j.rows) rows = rows.concat(j.rows);
      snap = j.now || snap;
    }
    const seen = new Set();
    DATA = rows.filter(r => {
      const k = r.ko + "|" + r.home + "|" + r.guest;
      if (seen.has(k)) return false;
      seen.add(k); return true;
    });
    RANGE = days; ISSUE = days[0];
    $("#snap").textContent = (days.length > 1 ? days[0] + " 起 " + days.length + " 天" : days[0])
                            + " · " + (snap ? snap.slice(11) : "") + " 抓取";
    if (days[0] < "2026-11-24") setScope("all");
    render();
    toast("载入 " + days.length + " 天，共 " + DATA.length + " 条");
  } catch(e){ toast("搜索失败：" + e.message); }
  btn.disabled = false; btn.textContent = "🔍 搜索";
}

function onDateChange(){
  render();          // 只按已载入的数据过滤，不自动发请求，也不动输入框
}

async function search(){
  const btn = $("#search");
  const days = daysBetween($("#from").value.slice(0, 10), $("#to").value.slice(0, 10));
  if (!canRemote()){
    render();
    toast("本地文件只含 " + ISSUE + " 一天；换日期需要配置云端地址");
    return;
  }
  if (days.length){ return loadIssues(days); }
  btn.disabled = true; btn.textContent = "搜索中…";
  try {
    const j = await fetchJson(API_BASE + "/json?issue=" + ISSUE + "&force=1");
    DATA = j.rows || []; SNAP = j.now; ISSUE = j.issue || ISSUE;
    $("#snap").textContent = ISSUE + " · " + SNAP.slice(11) + " 抓取";
    render();
    toast(j.warn ? j.warn : "已更新 " + SNAP);
  } catch(e){ toast("搜索失败：" + e.message); }
  btn.disabled = false; btn.textContent = "🔍 搜索";
}

document.querySelectorAll(".chip").forEach(c => c.onclick = () => { setScope(c.dataset.scope); render(); });
document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.scope === scope));
$("#from").onchange = onDateChange;
$("#to").onchange = onDateChange;
$("#search").onclick = search;

if (!canRemote()){
  const bar = document.createElement("div");
  bar.style.cssText = "margin:10px 12px 0;padding:9px 12px;border-radius:9px;background:#1b2027;" +
    "border:1px solid #2a3038;color:#9ba7b4;font-size:12px;line-height:1.5";
  bar.textContent = "静态快照：数据截至 " + SNAP + "，不会自动更新。看实时数据请用服务地址打开。";
  document.body.insertBefore(bar, document.getElementById("list"));
} else if (API_BASE){
  const bar = document.createElement("div");
  bar.style.cssText = "margin:10px 12px 0;padding:8px 12px;border-radius:9px;background:#12261a;" +
    "border:1px solid #1f6b3a;color:#7ee2a8;font-size:12px;line-height:1.5";
  bar.textContent = "云端模式：点「搜索」实时取数（" + API_BASE.replace(/^https?:\/\//, "") + "）";
  document.body.insertBefore(bar, document.getElementById("list"));
}
render();
</script></body></html>
